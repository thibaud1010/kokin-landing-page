<!doctype html>
<!-- ============================================================================
     /app — MARCADOR. La aplicación real (donde se traza el patrón) es otro
     proyecto/documento y NO comparte estado con la landing. Aquí solo queda
     este stub para que el CTA resuelva y para dejar fijado el noindex: la app
     no debe indexarse. Sustituye este archivo por el despliegue real de la app.
     ========================================================================= -->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Kokin — App</title>
  <link rel="stylesheet" href="/assets/css/kokin.css">
</head>
<body>
  <main id="contenido" class="wrap" style="min-height:80vh; display:grid; align-content:center; gap:1.2rem; padding-block:var(--section-y)">
    <a class="brand" href="/es/" style="font-size:1.8rem"><b>Kokin</b></a>
    <h1 style="font-size:var(--step-2)">Aquí va la aplicación</h1>
    <p class="muted">Este es el marcador de <code>/app</code>. La aplicación que traza tu patrón se despliega en esta ruta, con <code>noindex</code>, sin compartir estado con la landing.</p>
    <p><a class="btn btn--ghost" href="/es/">← Volver a la web</a></p>
  </main>
</body>
</html>
